<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TN TCAP Grade 5 ELA – Subpart 4 Practice</title>
  <style>
/* ————————————————————————————————
   LILAC UPGRADED UI — FULL CSS
———————————————————————————————— */

:root {
  --lilac-main: #b38cff;
  --lilac-dark: #7a5ad9;
  --lilac-soft: #f4efff;
  --accent-green: #2eaf7d;
  --accent-red: #e0526f;
  --bg-deep: #0f0b1a;
  --card-bg: #181326;
  --text-main: #000000;
  --text-light: #f7f4ff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: radial-gradient(circle at top left, #2b1f4a 0, #0b0714 45%, #05030a 100%);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: stretch;
}

/* Layout */

.app-shell {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  gap: 18px;
  width: min(1200px, 100%);
  padding: 18px;
}

@media (max-width: 900px) {
  .app-shell {
    grid-template-columns: 1fr;
  }
}

/* Panels */

.panel {
  background: linear-gradient(145deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,0.08);
  box-shadow:
    0 18px 40px rgba(0,0,0,0.6),
    0 0 0 1px rgba(255,255,255,0.02);
  backdrop-filter: blur(18px);
  padding: 18px 20px;
  position: relative;
  overflow: hidden;
}

.panel::before {
  content: "";
  position: absolute;
  inset: -40%;
  background:
    radial-gradient(circle at 0% 0%, rgba(179,140,255,0.18), transparent 55%),
    radial-gradient(circle at 100% 0%, rgba(255,255,255,0.06), transparent 55%);
  opacity: 0.9;
  pointer-events: none;
  z-index: -1;
}

.main-panel {
  display: flex;
  flex-direction: column;
  gap: 10px;
  color: var(--text-main);
}

/* Header / avatar */

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 10px;
}

.title-block h1 {
  font-size: 1.1rem;
  margin: 0;
  color: var(--lilac-soft);
  letter-spacing: 0.03em;
  text-transform: uppercase;
}

.title-block p {
  margin: 2px 0 0;
  font-size: 0.78rem;
  color: rgba(244,239,255,0.8);
}

.chip {
  font-size: 0.7rem;
  padding: 4px 10px;
  border-radius: 999px;
  background: rgba(179,140,255,0.16);
  color: var(--lilac-soft);
  border: 1px solid rgba(179,140,255,0.6);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.avatar-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
  margin-bottom: 14px;
}

.avatar {
  width: 44px;
  height: 44px;
  border-radius: 16px;
  background: radial-gradient(circle at 30% 0%, #ffe27a 0, #f7b733 30%, #f05a28 70%, #7a5ad9 100%);
  position: relative;
  box-shadow:
    0 0 0 2px rgba(255,255,255,0.18),
    0 10px 20px rgba(0,0,0,0.6);
  overflow: hidden;
}

.avatar::after {
  content: "";
  position: absolute;
  inset: 18% 22%;
  border-radius: 999px;
  border: 2px solid #f7f4ff;
  border-bottom-color: transparent;
  border-left-color: transparent;
  transform: rotate(18deg);
}

.avatar-text {
  font-size: 0.8rem;
  color: rgba(244,239,255,0.9);
}

.avatar-text strong {
  color: var(--lilac-soft);
}

/* Dashboard */

.dashboard-section-title {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: rgba(244,239,255,0.8);
  margin: 10px 0 4px;
}

.meta-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}

.meta-card {
  background: rgba(8,4,20,0.8);
  border-radius: 12px;
  padding: 8px 10px;
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--lilac-soft);
  font-size: 0.75rem;
}

.meta-label {
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 0.65rem;
  opacity: 0.7;
  margin-bottom: 2px;
}

.meta-value {
  font-weight: 600;
}

.progress-bar-shell {
  margin-top: 6px;
  height: 6px;
  border-radius: 999px;
  background: rgba(255,255,255,0.08);
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  width: 0%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--lilac-main), #ffb86c);
  transition: width 0.25s ease-out;
}

.score-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 4px;
}

.score-main {
  font-size: 1.4rem;
  color: var(--lilac-soft);
  font-variant-numeric: tabular-nums;
}

.score-sub {
  font-size: 0.8rem;
  color: rgba(244,239,255,0.8);
}

.score-badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 6px;
}

.score-badge {
  font-size: 0.7rem;
  padding: 3px 8px;
  border-radius: 999px;
  background: rgba(8,4,20,0.9);
  border: 1px solid rgba(244,239,255,0.16);
  color: rgba(244,239,255,0.9);
}

.pill-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 6px;
}

.pill {
  font-size: 0.7rem;
  padding: 3px 8px;
  border-radius: 999px;
  border: 1px solid rgba(244,239,255,0.2);
  color: rgba(244,239,255,0.9);
  background: rgba(8,4,20,0.7);
}

.mini-list {
  margin-top: 6px;
  font-size: 0.75rem;
  color: rgba(244,239,255,0.9);
}

.mini-list p {
  margin: 2px 0;
}

.tag-lit {
  border-left: 3px solid #ffb86c;
  padding-left: 6px;
}

.tag-info {
  border-left: 3px solid #2eaf7d;
  padding-left: 6px;
}

.control-row {
  margin-top: 10px;
  display: flex;
  gap: 8px;
}

/* Timer */

.timer-floating {
  position: fixed;
  top: 14px;
  right: 16px;
  z-index: 50;
  background: rgba(8,4,20,0.92);
  border-radius: 999px;
  padding: 6px 12px;
  border: 1px solid rgba(179,140,255,0.7);
  box-shadow: 0 10px 25px rgba(0,0,0,0.7);
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.8rem;
  color: var(--lilac-soft);
}

.timer-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent-green);
  box-shadow: 0 0 10px rgba(46,175,125,0.9);
}

.timer-floating[data-state="warning"] .timer-dot {
  background: #ffb86c;
  box-shadow: 0 0 10px rgba(255,184,108,0.9);
}

.timer-floating[data-state="danger"] .timer-dot {
  background: var(--accent-red);
  box-shadow: 0 0 10px rgba(224,82,111,0.9);
}

.timer-label {
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 0.65rem;
  opacity: 0.8;
}

.timer-value {
  font-variant-numeric: tabular-nums;
  font-weight: 600;
}

.timer-controls {
  display: flex;
  gap: 4px;
  margin-left: 6px;
}

.timer-btn {
  border-radius: 999px;
  border: 1px solid rgba(244,239,255,0.4);
  background: transparent;
  color: var(--lilac-soft);
  font-size: 0.65rem;
  padding: 2px 6px;
  cursor: pointer;
}

.timer-btn:hover:not(:disabled) {
  background: rgba(244,239,255,0.08);
}

/* Passage */

.passage-card {
  background: #ffffff;
  border-radius: 14px;
  padding: 14px 16px;
  border: 1px solid rgba(0,0,0,0.08);
  max-height: 260px;
  overflow: auto;
}

.passage-label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #7a5ad9;
  margin-bottom: 2px;
}

.passage-title {
  margin: 0 0 6px;
  font-size: 1rem;
  color: #1b1335;
}

.passage-body p {
  margin: 4px 0;
  font-size: 0.86rem;
  color: #222222;
}

/* Question */

.question-card {
  background: #ffffff;
  border-radius: 14px;
  padding: 14px 16px 16px;
  border: 1px solid rgba(0,0,0,0.08);
}

.question-header-row {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 6px;
}

.question-index {
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: #7a5ad9;
}

.question-standard {
  font-size: 0.7rem;
  color: #555;
}

.question-text {
  font-size: 0.95rem;
  color: #000000;
  margin-bottom: 6px;
}

.question-extra {
  font-size: 0.8rem;
  color: #444;
  margin-bottom: 8px;
  font-style: italic;
}

/* Options */

.options-grid {
  display: grid;
  gap: 8px;
  margin-bottom: 10px;
}

.option-btn {
  border-radius: 999px;
  border: 1px solid rgba(0,0,0,0.12);
  padding: 8px 10px;
  font-size: 0.9rem;
  background: #ffffff;
  color: #000000;
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  transition: all 0.16s ease-out;
  text-align: left;
}

.option-btn:hover:not(:disabled) {
  border-color: var(--lilac-main);
  box-shadow: 0 0 0 1px rgba(179,140,255,0.4);
  transform: translateY(-1px);
}

.option-btn[data-state="selected"] {
  background: #e6ddff;
  border-color: var(--lilac-dark);
  box-shadow: 0 0 0 1px rgba(122,90,217,0.7);
}

.option-btn[data-state="correct"] {
  background: #e0f7ef;
  border-color: var(--accent-green);
  box-shadow: 0 0 0 1px rgba(46,175,125,0.7);
}

.option-btn[data-state="incorrect"] {
  background: #ffe6ee;
  border-color: var(--accent-red);
  box-shadow: 0 0 0 1px rgba(224,82,111,0.7);
}

.option-key {
  width: 22px;
  height: 22px;
  border-radius: 999px;
  background: #ffffff;
  border: 1px solid rgba(0,0,0,0.12);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  font-weight: 600;
}

/* Feedback */

.feedback-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 0.85rem;
  margin-bottom: 6px;
  min-height: 24px;
}

.feedback-icon {
  width: 18px;
  height: 18px;
  border-radius: 999px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  color: #ffffff;
  flex-shrink: 0;
}

.feedback-icon.correct {
  background: var(--accent-green);
}

.feedback-icon.incorrect {
  background: var(--accent-red);
}

.feedback-text {
  color: #222;
}

.feedback-text strong {
  font-weight: 600;
}

.explanation {
  font-size: 0.8rem;
  color: #444;
  background: #f7f3ff;
  border-radius: 10px;
  padding: 6px 8px;
  border: 1px dashed rgba(122,90,217,0.5);
  display: none;
}

.explanation[data-visible="true"] {
  display: block;
}

/* Nav row */

.nav-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 10px;
  gap: 10px;
}

.nav-left {
  font-size: 0.8rem;
  color: #333;
}

.nav-left span {
  font-variant-numeric: tabular-nums;
}

.nav-right {
  display: flex;
  gap: 8px;
  align-items: center;
}

.pill-mini {
  font-size: 0.7rem;
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(122,90,217,0.1);
  color: #7a5ad9;
  border: 1px solid rgba(122,90,217,0.4);
}

/* Buttons */

.btn {
  border-radius: 999px;
  border: none;
  padding: 7px 14px;
  font-size: 0.85rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 500;
  transition: all 0.16s ease-out;
  white-space: nowrap;
}

.btn-primary {
  background: linear-gradient(135deg, var(--lilac-main), var(--lilac-dark));
  color: #ffffff;
  box-shadow: 0 10px 20px rgba(0,0,0,0.5);
}

.btn-primary:disabled {
  opacity: 0.4;
  cursor: default;
  box-shadow: none;
}

.btn-primary:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 14px 26px rgba(0,0,0,0.6);
}

.btn-ghost {
  background: transparent;
  color: var(--lilac-soft);
  border: 1px solid rgba(122,90
